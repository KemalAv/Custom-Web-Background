<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Custom Web Background</title>
    <link rel="stylesheet" href="popup.css">
</head>

<body>
    <div class="container">
        <header>
            <div class="header-title-row">
                <h3>
                    <span>Custom Web Background</span>
                </h3>
                <button id="helpButton" class="help-button" type="button" aria-label="Open the user guide"
                    title="User guide">?</button>
            </div>
            <div class="toggle-switch">
                <label for="enabledCheckbox">Enable Extension</label>
                <input type="checkbox" id="enabledCheckbox" checked>
            </div>
        </header>

        <p class="mode-hint">Semi-transparent Glass UI is enabled by default.</p>

        <main id="settings-panel">

            <section class="form-group">
                <div class="toggle-switch">
                    <label for="animationsCheckbox" style="font-weight: normal;">Enable UI Animations</label>
                    <input type="checkbox" id="animationsCheckbox" checked>
                </div>
            </section>

            <section class="form-group">
                <div class="toggle-switch">
                    <label for="autoTextColorCheckbox" style="font-weight: normal;">Correct Text Color</label>
                    <input type="checkbox" id="autoTextColorCheckbox" checked>
                </div>
            </section>

            <section class="form-group">
                <label>Background Media (JPG, PNG, GIF, MP4)</label>
                <div class="video-note" style="font-size: 11px; margin-bottom: 6px; color: #666;">
                    Supports images and MP4 video backgrounds.
                </div>
                <input type="file" id="imageUpload" accept="image/jpeg,image/png,image/gif,video/mp4" hidden>
                <button id="uploadButton" class="button-secondary">Choose File...</button>
                <span id="currentImageName">Built-in background</span>
            </section>

            <section class="form-group">
                <label>Or Enter Media URL</label>
                <input type="url" id="imageUrlInput" placeholder="https://example.com/image.jpg"
                    style="width: 100%; margin-top: 6px; padding: 6px;">
                <button id="applyUrlButton" class="button-secondary" style="margin-top: 6px;">Apply URL</button>
            </section>

            <section class="form-group">
                <label for="blurSlider">Background Blur: <span id="blurValue">0px</span></label>
                <input type="range" id="blurSlider" min="0" max="30" step="1" value="0">
            </section>

            <section class="form-group">
                <label for="dimLevel">Background Dim: <span id="dimValue">50%</span></label>
                <input type="range" id="dimLevel" min="0" max="1" step="0.05" value="0.5">
            </section>

            <section class="form-group">
                <label>Dim Overlay Color:</label>
                <div class="radio-group" id="dimColorGroup">
                    <label><input type="radio" name="dimColor" value="auto" checked> Auto</label>
                    <label><input type="radio" name="dimColor" value="black"> Black</label>
                    <label><input type="radio" name="dimColor" value="white"> White</label>
                    <label><input type="radio" name="dimColor" value="custom"> Custom</label>
                </div>
                <p class="mode-hint">Auto follows your device theme: black for dark mode, white for light mode.</p>
                <div class="custom-color-row" id="customDimColorSection" hidden>
                    <label for="customDimColor">Pick color</label>
                    <input type="color" id="customDimColor" value="#000000">
                    <output id="customDimColorValue" for="customDimColor">#000000</output>
                </div>
            </section>

        </main>

        <footer>
            <button id="saveButton" class="button-primary">Apply & Save</button>
            <div id="status"></div>
            <p class="donate-link">
                Gimmie your money please:
                <a href="https://sociabuzz.com/kemalavicennafaza" target="_blank" rel="noopener noreferrer">
                    sociabuzz.com/kemalavicennafaza
                </a>
            </p>
        </footer>
    </div>

    <script src="popup.js"></script>
</body>

</html>
