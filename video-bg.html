<!DOCTYPE html>
<html>

<head>
    <meta charset="UTF-8">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html,
        body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: transparent;
            contain: strict;
        }

        video {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            transform: translateZ(0);
            backface-visibility: hidden;
            will-change: transform, filter;
            pointer-events: none;
        }
    </style>
</head>

<body>
    <video id="bgVideo" autoplay loop muted playsinline preload="auto" disablepictureinpicture disableremoteplayback></video>
    <script src="video-bg.js"></script>
</body>

</html>
